<!doctype html>
<html lang="it">

<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="google-site-verification" content="Gwqm8xRqMxuO_Rl3FpZ14an7X4Uo7kxbQfw4gZkRGw4" />
  <title>GamePeople Benevento | Videogiochi, TCG, Snack e Tornei</title>
  <meta name="description"
    content="Negozio di intrattenimento e pop culture al C.C. I Sanniti, Benevento. Videogiochi nuovi e usati, carte collezionabili, manga, Funko, boardgame, tornei settimanali e Area Tornei.">
  <link rel="icon" href="../assets/logo-favicon.svg" type="image/svg+xml">
  <link rel="stylesheet" href="../colors_and_type.css">
  <style>
    * {
      box-sizing: border-box;
    }

    html {
      scroll-behavior: smooth;
    }

    body {
      margin: 0;
      background: var(--bg-stage);
      color: var(--fg-1);
      font-family: var(--font-body);
      -webkit-font-smoothing: antialiased;
      overflow-x: hidden;
    }

    a {
      color: inherit;
      text-decoration: none;
    }

    img {
      display: block;
      max-width: 100%;
    }

    ::selection {
      background: var(--gp-magenta-bright);
      color: #fff;
    }

    .wrap {
      max-width: 1200px;
      margin: 0 auto;
      padding: 0 28px;
    }

    .eyebrow {
      font-size: 13px;
      font-weight: 700;
      letter-spacing: .16em;
      text-transform: uppercase;
      color: var(--fg-blue);
    }

    .sec-title {
      font-family: var(--font-display);
      font-weight: 800;
      text-transform: uppercase;
      letter-spacing: -0.01em;
      line-height: .95;
      font-size: clamp(40px, 6vw, 76px);
      margin: 10px 0 0;
      color: #fff;
    }

    .sec-title .glow {
      text-shadow: var(--glow-headline-soft);
    }

    .lead {
      color: var(--fg-2);
      font-size: clamp(16px, 1.6vw, 19px);
      line-height: 1.6;
      max-width: 62ch;
      text-wrap: pretty;
    }

    /* ---- buttons ---- */
    .btn {
      display: inline-flex;
      align-items: center;
      gap: 9px;
      font-family: var(--font-body);
      font-weight: 700;
      text-transform: uppercase;
      font-size: 14px;
      letter-spacing: .06em;
      padding: 15px 26px;
      border-radius: var(--radius-pill);
      border: 1.5px solid transparent;
      cursor: pointer;
      transition: transform .15s cubic-bezier(.2, .7, .3, 1), filter .15s ease, background .15s ease, color .15s ease, border-color .15s ease;
    }

    .btn:active {
      transform: scale(.97);
    }

    .btn--primary {
      background: var(--gp-blue);
      color: #06222f;
    }

    .btn--primary:hover {
      filter: brightness(1.08);
    }

    .btn--magenta {
      background: var(--gp-magenta);
      color: #fff;
    }

    .btn--magenta:hover {
      filter: brightness(1.1);
    }

    .btn--ghost {
      background: transparent;
      color: #fff;
      border-color: rgba(255, 255, 255, .32);
    }

    .btn--ghost:hover {
      border-color: #fff;
      background: rgba(255, 255, 255, .06);
    }

    .btn--whatsapp {
      background: #25D366;
      color: #fff !important;
      border-radius: var(--radius-pill);
      font-size: 12px;
      padding: 8px 18px;
      display: inline-flex;
      align-items: center;
      gap: 6px;
      font-weight: 700;
      text-transform: uppercase;
      letter-spacing: .04em;
      margin-top: 12px;
      transition: transform .15s ease, filter .15s ease;
    }

    .btn--whatsapp:hover {
      filter: brightness(1.08);
      transform: scale(1.02);
    }

    .btn--whatsapp:active {
      transform: scale(0.98);
    }

    .btn--whatsapp svg {
      fill: currentColor;
      width: 15px;
      height: 15px;
    }

    .product__ask:hover .arrow-icon {
      transform: translateX(4px);
    }

    /* ---- nav ---- */
    .nav {
      position: sticky;
      top: 0;
      z-index: 50;
      backdrop-filter: blur(12px);
      background: rgba(12, 16, 20, .72);
      border-bottom: 1px solid var(--border-hairline);
      transition: background .2s ease;
    }

    .nav__inner {
      display: flex;
      align-items: center;
      gap: 20px;
      height: 74px;
    }

    .nav__logo {
      height: 42px;
      width: auto;
      filter: drop-shadow(0 4px 14px rgba(0, 0, 0, .5));
    }

    .nav__links {
      display: flex;
      gap: 6px;
      margin-left: auto;
      align-items: center;
    }

    .nav__links a {
      font-size: 14px;
      font-weight: 600;
      letter-spacing: .02em;
      color: var(--fg-2);
      padding: 9px 13px;
      border-radius: 8px;
      transition: color .15s, background .15s;
    }

    .nav__links a:hover {
      color: #fff;
      background: rgba(255, 255, 255, .06);
    }

    .nav__social {
      display: flex;
      gap: 8px;
      align-items: center;
      margin-left: 6px;
    }

    .nav__social a {
      width: 38px;
      height: 38px;
      border-radius: 50%;
      display: grid;
      place-items: center;
      background: rgba(255, 255, 255, .07);
      transition: background .15s, transform .15s;
    }

    .nav__social a:hover {
      background: var(--gp-magenta);
      transform: translateY(-1px);
    }

    .nav__social svg {
      width: 18px;
      height: 18px;
      fill: #fff;
    }

    .nav__cta {
      margin-left: 10px;
    }

    .nav__burger {
      display: none;
      margin-left: auto;
      width: 44px;
      height: 44px;
      border-radius: 10px;
      border: 1px solid var(--border-strong);
      background: transparent;
      cursor: pointer;
      align-items: center;
      justify-content: center;
      flex-direction: column;
      gap: 5px;
    }

    .nav__burger span {
      width: 20px;
      height: 2px;
      background: #fff;
      border-radius: 2px;
      transition: .2s;
    }

    .mobilemenu {
      position: fixed;
      top: 102px;
      left: 0;
      right: 0;
      height: calc(100vh - 102px); /* Explicit height calculation to prevent containing block collapse */
      z-index: 49;
      background: #0C1014; /* Solid page background to prevent transparency issues */
      backdrop-filter: blur(20px);
      -webkit-backdrop-filter: blur(20px);
      display: flex;
      flex-direction: column;
      padding: 24px 28px;
      gap: 6px;
      transform: translateY(-8px);
      opacity: 0;
      pointer-events: none;
      transition: .22s;
      overflow-y: auto;
    }

    .mobilemenu.open {
      opacity: 1;
      transform: none;
      pointer-events: auto;
    }

    .mobilemenu a {
      font-family: var(--font-display);
      font-weight: 700;
      font-size: 30px;
      text-transform: uppercase;
      color: #fff;
      padding: 12px 0;
      border-bottom: 1px solid var(--border-hairline);
    }

    section {
      position: relative;
    }

    .pad {
      padding: clamp(64px, 9vw, 120px) 0;
    }

    /* ---- hero ---- */
    .hero {
      min-height: 92vh;
      display: flex;
      align-items: center;
      overflow: hidden;
    }

    .hero__bg {
      position: absolute;
      inset: 0;
      z-index: 0;
    }

    .hero__bg image-slot {
      width: 100%;
      height: 100%;
    }

    .hero__scrim {
      position: absolute;
      inset: 0;
      z-index: 1;
      background: radial-gradient(120% 90% at 50% 0%, rgba(12, 16, 20, .55) 0%, rgba(12, 16, 20, .82) 55%, #0C1014 100%);
    }

    .hero__inner {
      position: relative;
      z-index: 2;
      width: 100%;
    }

    .hero h1 {
      font-family: var(--font-display);
      font-weight: 800;
      text-transform: uppercase;
      letter-spacing: -0.015em;
      line-height: .9;
      margin: 14px 0 0;
      font-size: clamp(54px, 10vw, 150px);
      color: #fff;
      text-shadow: var(--glow-headline);
    }

    .hero h1 em {
      font-style: normal;
      color: #fff;
      display: block;
    }

    .hero__sub {
      margin: 22px 0 0;
      color: var(--fg-2);
      font-size: clamp(17px, 2vw, 22px);
      line-height: 1.5;
      max-width: 54ch;
    }

    .hero__cta {
      display: flex;
      gap: 14px;
      margin-top: 34px;
      flex-wrap: wrap;
    }

    .hero__scroll {
      position: absolute;
      left: 50%;
      bottom: 26px;
      transform: translateX(-50%);
      z-index: 2;
      display: flex;
      flex-direction: column;
      align-items: center;
      gap: 8px;
      color: var(--fg-3);
      font-size: 11px;
      letter-spacing: .18em;
      text-transform: uppercase;
      animation: bob 2.4s ease-in-out infinite;
    }

    .hero__scroll img {
      width: 22px;
      opacity: .7;
    }

    @keyframes bob {

      0%,
      100% {
        transform: translate(-50%, 0);
      }

      50% {
        transform: translate(-50%, 7px);
      }
    }

    /* ---- games strip ---- */
    .games {
      display: grid;
      grid-template-columns: repeat(auto-fit, minmax(150px, 1fr));
      gap: 14px;
      margin-top: 42px;
    }

    .game {
      position: relative;
      border-radius: var(--radius-md);
      overflow: hidden;
      border: 1px solid var(--border-hairline);
      background: var(--bg-card);
      aspect-ratio: 3/4;
      display: flex;
      align-items: flex-end;
      cursor: pointer;
      transition: transform .18s ease, border-color .18s ease;
    }

    .game:hover {
      transform: translateY(-4px);
      border-color: var(--gp-magenta-bright);
    }

    .game image-slot {
      position: absolute;
      inset: 0;
      width: 100%;
      height: 100%;
    }

    .game__scrim {
      position: absolute;
      inset: 0;
      background: linear-gradient(180deg, rgba(12, 16, 20, .1) 30%, rgba(12, 16, 20, .9) 100%);
      z-index: 1;
    }

    .game__name {
      position: relative;
      z-index: 2;
      padding: 16px;
      font-family: var(--font-display);
      font-weight: 700;
      font-size: 21px;
      text-transform: uppercase;
      line-height: 1;
      letter-spacing: -0.01em;
    }

    .game__name small {
      display: block;
      font-family: var(--font-body);
      font-weight: 600;
      font-size: 11px;
      letter-spacing: .1em;
      color: var(--fg-blue);
      margin-bottom: 6px;
    }

    /* ---- catalog ---- */
    .filters {
      display: flex;
      gap: 9px;
      flex-wrap: wrap;
      margin-top: 34px;
    }

    .chip {
      font-family: var(--font-body);
      font-weight: 700;
      font-size: 13px;
      letter-spacing: .04em;
      text-transform: uppercase;
      padding: 9px 16px;
      border-radius: var(--radius-pill);
      border: 1.5px solid var(--border-strong);
      background: transparent;
      color: var(--fg-2);
      cursor: pointer;
      transition: .15s;
    }

    .chip:hover {
      color: #fff;
      border-color: #fff;
    }

    .chip.active {
      background: #fff;
      color: #0C1014;
      border-color: #fff;
    }

    .catalog {
      display: grid;
      grid-template-columns: repeat(auto-fill, minmax(240px, 1fr));
      gap: 18px;
      margin-top: 30px;
    }

    .product {
      background: var(--bg-card);
      border: 1px solid var(--border-hairline);
      border-radius: var(--radius-md);
      overflow: hidden;
      display: flex;
      flex-direction: column;
      transition: transform .18s ease, border-color .18s ease, box-shadow .18s ease;
    }

    .product:hover {
      transform: translateY(-4px);
      border-color: var(--border-strong);
      box-shadow: var(--shadow-card);
    }

    .product__img {
      position: relative;
      aspect-ratio: 1;
      background: var(--bg-card-2);
    }

    .product__img image-slot {
      position: absolute;
      inset: 0;
      width: 100%;
      height: 100%;
    }

    .product__tag {
      position: absolute;
      top: 12px;
      left: 12px;
      z-index: 2;
      font-size: 11px;
      font-weight: 700;
      letter-spacing: .06em;
      text-transform: uppercase;
      padding: 5px 10px;
      border-radius: var(--radius-pill);
      background: var(--gp-magenta);
      color: #fff;
    }

    .product__body {
      padding: 16px 16px 18px;
      display: flex;
      flex-direction: column;
      gap: 4px;
      flex: 1;
    }

    .product__game {
      font-size: 11px;
      font-weight: 700;
      letter-spacing: .1em;
      text-transform: uppercase;
      color: var(--fg-blue);
    }

    .product__name {
      font-weight: 700;
      font-size: 16px;
      color: #fff;
      line-height: 1.25;
    }

    .product__row {
      margin-top: auto;
      display: flex;
      align-items: center;
      justify-content: space-between;
      padding-top: 14px;
    }

    .product__price {
      font-family: var(--font-display);
      font-weight: 700;
      font-size: 24px;
      color: #fff;
    }

    .product__price small {
      font-size: 13px;
      color: var(--fg-3);
      font-family: var(--font-body);
      font-weight: 600;
    }

    .product__ask {
      font-size: 12px;
      font-weight: 700;
      text-transform: uppercase;
      letter-spacing: .04em;
      color: var(--gp-blue-bright);
    }

    .catalog__note {
      margin-top: 22px;
      color: var(--fg-3);
      font-size: 13px;
    }

    /* ---- events ---- */
    .events {
      display: flex;
      flex-direction: column;
      gap: 14px;
      margin-top: 36px;
    }

    .event {
      display: grid;
      grid-template-columns: 128px 1fr auto;
      gap: 24px;
      align-items: center;
      background: var(--bg-card);
      border: 1px solid var(--border-hairline);
      border-radius: var(--radius-md);
      padding: 22px 24px;
      transition: border-color .18s, background .18s;
    }

    .event:hover {
      border-color: var(--gp-blue-bright);
    }

    .event__date {
      text-align: center;
      border-right: 1px solid var(--border-hairline);
      padding-right: 20px;
    }

    .event__day {
      font-family: var(--font-moment);
      font-weight: 700;
      font-size: 44px;
      line-height: .85;
      color: var(--gp-magenta-bright);
      text-shadow: var(--glow-magenta);
    }

    .event__mon {
      font-family: var(--font-moment);
      font-weight: 700;
      font-size: 16px;
      text-transform: uppercase;
      letter-spacing: .08em;
      color: var(--fg-2);
    }

    .event__name {
      font-family: var(--font-display);
      font-weight: 700;
      font-size: 24px;
      text-transform: uppercase;
      letter-spacing: -0.01em;
      line-height: 1.02;
    }

    .event__meta {
      margin-top: 7px;
      display: flex;
      gap: 16px;
      flex-wrap: wrap;
      color: var(--fg-2);
      font-size: 14px;
    }

    .event__meta b {
      color: var(--fg-blue);
      font-weight: 700;
    }

    .event__time {
      font-family: var(--font-moment);
      font-style: italic;
      font-weight: 400;
      font-size: 30px;
      color: #fff;
      white-space: nowrap;
    }

    /* ---- about ---- */
    .about {
      display: grid;
      grid-template-columns: 1fr 1fr;
      gap: 54px;
      align-items: center;
    }

    .about__media {
      position: relative;
      border-radius: var(--radius-lg);
      overflow: hidden;
      aspect-ratio: 4/5;
      border: 1px solid var(--border-hairline);
    }

    .about__media image-slot {
      position: absolute;
      inset: 0;
      width: 100%;
      height: 100%;
    }

    .about__stats {
      display: flex;
      gap: 30px;
      margin-top: 30px;
      flex-wrap: wrap;
    }

    .stat__n {
      font-family: var(--font-display);
      font-weight: 800;
      font-size: 46px;
      color: #fff;
      line-height: 1;
      text-shadow: var(--glow-headline-soft);
    }

    .stat__l {
      color: var(--fg-2);
      font-size: 13px;
      margin-top: 6px;
      letter-spacing: .02em;
    }

    /* ---- visit ---- */
    .visit {
      display: grid;
      grid-template-columns: 1fr 1fr;
      gap: 40px;
      align-items: stretch;
    }

    .panel {
      background: var(--bg-card);
      border: 1px solid var(--border-hairline);
      border-radius: var(--radius-lg);
      padding: 32px;
    }

    .hours {
      list-style: none;
      margin: 18px 0 0;
      padding: 0;
    }

    .hours li {
      display: flex;
      justify-content: space-between;
      padding: 12px 0;
      border-bottom: 1px solid var(--border-hairline);
      font-size: 16px;
    }

    .hours li:last-child {
      border-bottom: none;
    }

    .hours .d {
      color: var(--fg-2);
      text-transform: capitalize;
    }

    .hours .h {
      font-weight: 700;
      color: #fff;
      font-variant-numeric: tabular-nums;
    }

    .hours li.today {
      margin: 0 -16px;
      padding: 12px 16px;
      background: rgba(224, 55, 159, .12);
      border-radius: 10px;
      border-bottom: none;
    }

    .hours li.today .d {
      color: var(--gp-magenta-bright);
      font-weight: 700;
    }

    .hours li.today .h {
      color: var(--gp-magenta-bright);
    }

    .visit__addr {
      display: flex;
      gap: 12px;
      align-items: flex-start;
      margin-top: 4px;
    }

    .visit__addr svg {
      flex: none;
      width: 24px;
      height: 24px;
      margin-top: 2px;
    }

    .visit__map {
      position: relative;
      border-radius: var(--radius-lg);
      overflow: hidden;
      border: 1px solid var(--border-hairline);
      min-height: 340px;
      background:
        repeating-linear-gradient(45deg, #12161b 0 22px, #14181d 22px 44px);
    }

    .visit__map image-slot {
      position: absolute;
      inset: 0;
      width: 100%;
      height: 100%;
    }

    .visit__pin {
      position: absolute;
      z-index: 2;
      left: 50%;
      top: 46%;
      transform: translate(-50%, -50%);
      display: flex;
      flex-direction: column;
      align-items: center;
      gap: 6px;
      pointer-events: none;
    }

    .visit__pin .dot {
      width: 18px;
      height: 18px;
      border-radius: 50%;
      background: var(--gp-magenta);
      box-shadow: 0 0 0 8px rgba(179, 30, 128, .25), 0 0 22px var(--gp-magenta-bright);
    }

    .visit__pin .lbl {
      background: #fff;
      color: #0C1014;
      font-weight: 700;
      font-size: 12px;
      padding: 5px 10px;
      border-radius: var(--radius-pill);
    }

    .visit__mapcta {
      position: absolute;
      z-index: 3;
      right: 16px;
      bottom: 16px;
    }

    /* ---- newsletter / footer ---- */
    .news {
      background: linear-gradient(135deg, var(--gp-magenta) 0%, #7d1659 60%, #1a2a6b 140%);
      border-radius: var(--radius-lg);
      padding: clamp(34px, 5vw, 60px);
      text-align: center;
      overflow: hidden;
      position: relative;
    }

    .news h3 {
      font-family: var(--font-display);
      font-weight: 800;
      text-transform: uppercase;
      font-size: clamp(30px, 4.4vw, 52px);
      line-height: .95;
      margin: 0;
      color: #fff;
      text-shadow: 0 2px 24px rgba(0, 0, 0, .3);
    }

    .news p {
      color: rgba(255, 255, 255, .85);
      margin: 14px auto 0;
      max-width: 46ch;
      font-size: 16px;
    }

    .news__form {
      display: flex;
      gap: 10px;
      justify-content: center;
      margin-top: 26px;
      flex-wrap: wrap;
    }

    .news__form input {
      flex: 1;
      min-width: 240px;
      max-width: 360px;
      padding: 15px 20px;
      border-radius: var(--radius-pill);
      border: 1.5px solid rgba(255, 255, 255, .4);
      background: rgba(255, 255, 255, .12);
      color: #fff;
      font-family: var(--font-body);
      font-size: 15px;
    }

    .news__form input::placeholder {
      color: rgba(255, 255, 255, .7);
    }

    .news__form input:focus {
      outline: none;
      border-color: #fff;
      background: rgba(255, 255, 255, .2);
    }

    .news__ok {
      color: #fff;
      font-weight: 700;
      margin-top: 22px;
      font-size: 18px;
    }

    footer {
      border-top: 1px solid var(--border-hairline);
      margin-top: 0;
    }

    .foot {
      display: flex;
      justify-content: space-between;
      align-items: center;
      gap: 24px;
      padding-top: 40px;
      padding-bottom: 40px;
      flex-wrap: wrap;
    }

    .foot__logo {
      height: 40px;
    }

    .foot__links {
      display: flex;
      gap: 20px;
      flex-wrap: wrap;
    }

    .foot__links a {
      color: var(--fg-2);
      font-size: 14px;
    }

    .foot__links a:hover {
      color: #fff;
    }

    .foot__legal {
      color: var(--fg-3);
      font-size: 12.5px;
    }

    .foot__social {
      display: flex;
      gap: 10px;
    }

    .foot__social a {
      width: 40px;
      height: 40px;
      border-radius: 50%;
      background: rgba(255, 255, 255, .07);
      display: grid;
      place-items: center;
      transition: .15s;
    }

    .foot__social a:hover {
      background: var(--gp-magenta);
    }

    .foot__social svg {
      width: 19px;
      height: 19px;
      fill: #fff;
    }

    @media (max-width:880px) {

      .nav__links,
      .nav__social,
      .nav__cta {
        display: none;
      }

      .nav__burger {
        display: flex;
      }

      .about,
      .visit {
        grid-template-columns: 1fr;
        gap: 32px;
      }

      .event {
        grid-template-columns: 84px 1fr;
      }

      .event__time {
        grid-column: 2;
        justify-self: start;
        font-size: 24px;
      }

      /* Spacing to keep scroll indicator from overlapping hero CTA buttons on mobile */
      .hero__inner {
        padding-bottom: 80px;
      }
    }

    @media (max-width:560px) {
      .wrap {
        padding: 0 20px;
      }

      .event__date {
        padding-right: 14px;
      }

      .event__day {
        font-size: 36px;
      }

      /* Scale down category card titles on mobile to prevent long words from clipping */
      .game__name {
        font-size: 16px;
        padding: 12px;
      }

      /* Adjust hero title font-size to prevent overflow on very narrow screens */
      .hero h1 {
        font-size: clamp(38px, 9vw, 80px);
      }

      /* Stack footer elements vertically and center them on mobile */
      .foot {
        flex-direction: column;
        align-items: center;
        gap: 20px;
        padding-top: 30px;
        padding-bottom: 30px;
      }

      .foot__links {
        justify-content: center;
        gap: 16px;
      }

      .foot__social {
        justify-content: center;
        margin-top: 8px;
      }

      .foot__legal {
        text-align: center;
      }
    }

    /* ---- reservation modal ---- */
    .modal-overlay {
      position: fixed;
      inset: 0;
      z-index: 100;
      background: rgba(12, 16, 20, 0.85);
      backdrop-filter: blur(8px);
      -webkit-backdrop-filter: blur(8px);
      display: grid;
      place-items: center;
      padding: 20px;
      animation: fadeIn 0.2s ease-out;
    }

    .modal-content {
      background: var(--bg-card-2);
      border: 1px solid var(--border-strong);
      border-radius: var(--radius-lg);
      width: 100%;
      max-width: 500px;
      padding: clamp(24px, 5vw, 36px);
      position: relative;
      box-shadow: var(--shadow-pop);
      animation: scaleIn 0.25s cubic-bezier(0.16, 1, 0.3, 1);
    }

    .modal-close {
      position: absolute;
      top: 18px;
      right: 18px;
      width: 32px;
      height: 32px;
      border-radius: 50%;
      border: 1px solid var(--border-hairline);
      background: rgba(255, 255, 255, 0.05);
      color: var(--fg-2);
      font-size: 24px;
      line-height: 1;
      cursor: pointer;
      display: grid;
      place-items: center;
      transition: all 0.15s ease;
      padding: 0;
    }

    .modal-close:hover {
      background: rgba(255, 255, 255, 0.15);
      color: #fff;
      border-color: var(--border-strong);
    }

    .modal-form input:focus {
      border-color: var(--gp-magenta-bright) !important;
      box-shadow: 0 0 0 3px rgba(224, 55, 159, 0.15);
    }

    @keyframes fadeIn {
      from { opacity: 0; }
      to { opacity: 1; }
    }

    @keyframes scaleIn {
      from { transform: scale(0.95); opacity: 0; }
      to { transform: scale(1); opacity: 1; }
    }
  </style>
</head>
